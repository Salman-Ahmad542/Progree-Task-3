name: Multi-Stage CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:

  # =========================
  # Stage 1: Lint
  # =========================
  lint:
    name: Stage 1 - Lint
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            default-libmysqlclient-dev \
            build-essential

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Flake8
        run: |
          flake8 app.py tests/


  # =========================
  # Stage 2: Unit Testing
  # =========================
  test:
    name: Stage 2 - Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    env:
      PYTHONPATH: .

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            default-libmysqlclient-dev \
            build-essential

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          pytest -v


  # =========================
  # Stage 3: Docker Build
  # =========================
  docker-build:
    name: Stage 3 - Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t two-tier-flaskapp:ci .

      - name: Verify Docker image
        run: |
          docker images two-tier-flaskapp:ci


  # =========================
  # Stage 4: Integration
  # =========================
  integration:
    name: Stage 4 - Docker Compose Integration
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Start Flask and MySQL
        run: |
          docker compose up -d --build

      - name: Check container status
        run: |
          docker compose ps

      - name: Show deployment logs
        run: |
          docker compose logs --no-color

      - name: Wait for Flask application
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:5000; then
              echo "Flask application is ready."
              exit 0
            fi

            echo "Waiting for Flask..."
            sleep 2
          done

          echo "Flask application failed to start."
          docker compose logs
          exit 1

      - name: Stop containers
        if: always()
        run: |
          docker compose down -v


  # =========================
  # Stage 5: Deployment Status
  # =========================
  deployment-status:
    name: Stage 5 - Deployment Status
    runs-on: ubuntu-latest
    needs: integration

    steps:
      - name: Deployment Success
        run: |
          echo "================================="
          echo "CI/CD PIPELINE SUCCESSFUL"
          echo "================================="
          echo "Linting       : PASSED"
          echo "Unit Tests    : PASSED"
          echo "Docker Build  : PASSED"
          echo "Integration   : PASSED"
          echo "Deployment    : SUCCESS"
          echo "================================="
