services:

  mysql:
    image: mysql:5.7
    container_name: progree-mysql
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: mydb
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-padmin"]
      timeout: 5s
      retries: 10
      interval: 5s

  flask:
    build: .
    container_name: progree-flask
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: admin
      MYSQL_DB: mydb
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
